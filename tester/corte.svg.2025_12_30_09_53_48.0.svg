         x="-476.77069"
         y="725.83398"
         id="tspan19">SVG To Blender:</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:Arial;-inkscape-font-specification:Arial;fill:#000000;fill-opacity:1;stroke-width:0.377953"
         x="-476.77069"
         y="741.02631"
         id="tspan56">-preferiblemente dejar colores planos</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:Arial;-inkscape-font-specification:Arial;fill:#000000;fill-opacity:1;stroke-width:0.377953"
         x="-476.77069"
         y="756.21857"
         id="tspan57">-evitar cruzar/superponer vertices/nodos/curvas/lineas</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:Arial;-inkscape-font-specification:Arial;fill:#000000;fill-opacity:1;stroke-width:0.377953"
         x="-476.77069"
         y="771.41089"
         id="tspan58">-no dejar vertices abiertos (path inicia con 'm' e indica cerrado con &quot;z&quot;)</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:Arial;-inkscape-font-specification:Arial;fill:#000000;fill-opacity:1;stroke-width:0.377953"
         x="-476.77069"
         y="786.60315"
         id="tspan59">-hacer joins de objetos en inkscape y no blender</tspan><tspan
         sodipodi:role="line"
         style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:Arial;-inkscape-font-specification:Arial;fill:#000000;fill-opacity:1;stroke-width:0.377953"
         x="-476.77069"
         y="801.79547"
         id="tspan80">-si en blender se &quot;recorta&quot; lafigura, forza reehacer nodo añadiendo un</tspan><tspan
